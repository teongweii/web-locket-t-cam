<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Trang Quản Trị Hệ Thống (Admin Panel)</title>
  <style>
    :root {
      --bg-color: #0f172a;
      --card-bg: #1e293b;
      --text-main: #f8fafc;
      --text-muted: #94a3b8;
      --primary: #3b82f6;
      --success: #10b981;
      --danger: #ef4444;
      --warning: #f59e0b;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background-color: var(--bg-color);
      color: var(--text-main);
      margin: 0;
      padding: 24px;
    }

    .container {
      max-width: 1200px;
      margin: 0 auto;
    }

    .header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 24px;
      padding-bottom: 16px;
      border-bottom: 1px solid #334155;
    }

    .btn-logout {
      background: var(--danger);
      color: white;
      border: none;
      padding: 8px 16px;
      border-radius: 6px;
      cursor: pointer;
      font-weight: 600;
    }

    /* Grid Thống Kê */
    .stats-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
      gap: 16px;
      margin-bottom: 32px;
    }

    .stat-card {
      background: var(--card-bg);
      padding: 20px;
      border-radius: 12px;
      border: 1px solid #334155;
    }

    .stat-card h3 {
      margin: 0 0 8px 0;
      font-size: 0.9rem;
      color: var(--text-muted);
    }

    .stat-card .value {
      font-size: 1.6rem;
      font-weight: bold;
      color: var(--text-main);
    }

    /* Bảng Quản Lý Đơn Hàng */
    .panel {
      background: var(--card-bg);
      border-radius: 12px;
      padding: 24px;
      border: 1px solid #334155;
      margin-bottom: 32px;
    }

    .panel h2 {
      margin-top: 0;
      margin-bottom: 16px;
      font-size: 1.2rem;
    }

    table {
      width: 100%;
      border-collapse: collapse;
      text-align: left;
    }

    th, td {
      padding: 12px;
      border-bottom: 1px solid #334155;
    }

    th {
      color: var(--text-muted);
      font-weight: 600;
    }

    .badge-star {
      background: rgba(245, 158, 11, 0.2);
      color: var(--warning);
      border: 1px solid var(--warning);
      padding: 2px 8px;
      border-radius: 4px;
      font-size: 0.75rem;
      margin-left: 6px;
    }

    .status-paid {
      color: var(--success);
      font-weight: 600;
    }

    .btn-activate {
      background: var(--primary);
      color: white;
      border: none;
      padding: 6px 12px;
      border-radius: 4px;
      cursor: pointer;
      margin-right: 6px;
    }

    .btn-delete {
      background: transparent;
      color: var(--danger);
      border: 1px solid var(--danger);
      padding: 6px 12px;
      border-radius: 4px;
      cursor: pointer;
    }

    /* Form Cấu Hình */
    .form-group {
      margin-bottom: 16px;
    }

    .form-group label {
      display: block;
      margin-bottom: 6px;
      color: var(--text-muted);
    }

    .form-group input {
      width: 100%;
      max-width: 400px;
      padding: 10px;
      border-radius: 6px;
      border: 1px solid #334155;
      background: #0f172a;
      color: white;
    }

    .btn-save {
      background: var(--success);
      color: white;
      border: none;
      padding: 10px 20px;
      border-radius: 6px;
      cursor: pointer;
      font-weight: 600;
    }
  </style>
</head>
<body>

  <div class="container">
    <div class="header">
      <h1>Hệ Thống Quản Trị (Admin Panel)</h1>
      <button class="btn-logout" onclick="executeLogout()">Đăng xuất</button>
    </div>

    <!-- Thống kê tổng quan -->
    <div class="stats-grid">
      <div class="stat-card">
        <h3>Tổng Doanh Thu</h3>
        <div class="value" id="total-revenue">0 VNĐ</div>
      </div>
      <div class="stat-card">
        <h3>Tổng Người Dùng</h3>
        <div class="value" id="total-users">0</div>
      </div>
      <div class="stat-card">
        <h3>Đơn Đang Chờ Xử Lý</h3>
        <div class="value" id="active-orders">0</div>
      </div>
    </div>

    <!-- Danh Sách Đơn Hàng & Kích Hoạt VIP -->
    <div class="panel">
      <h2>Danh Sách Đơn Hàng & Kích Hoạt VIP</h2>
      <table>
        <thead>
          <tr>
            <th>Mã đơn</th>
            <th>Tài khoản</th>
            <th>Gói cước</th>
            <th>Trạng thái</th>
            <th>Hành động</th>
          </tr>
        </thead>
        <tbody id="orders-table-body">
          <!-- Dữ liệu JS tự động render vào đây -->
        </tbody>
      </table>
    </div>

    <!-- Cấu Hình Hệ Thống -->
    <div class="panel">
      <h2>Cấu Hình Ngân Hàng Thanh Toán</h2>
      <form onsubmit="saveBankConfig(event)">
        <div class="form-group">
          <label for="bank-name">Tên Ngân Hàng</label>
          <input type="text" id="bank-name" placeholder="VD: MBBank, Vietcombank" required />
        </div>
        <div class="form-group">
          <label for="account-number">Số Tài Khoản</label>
          <input type="text" id="account-number" placeholder="Số tài khoản nhận tiền" required />
        </div>
        <div class="form-group">
          <label for="account-holder">Chủ Tài Khoản</label>
          <input type="text" id="account-holder" placeholder="Tên chủ tài khoản" required />
        </div>
        <button type="submit" class="btn-save">Lưu Cấu Hình</button>
      </form>
    </div>
  </div>

  <!-- SCRIPT XỬ LÝ ADMIN PANEL -->
  <script>
    // 1. Cấu hình & Biến toàn cục
    const API_BASE_URL = '/api/admin';
    const PRIVILEGED_USERS = ['truongphutrong', 'teongwei'];

    // 2. Kiểm tra xác thực khi tải trang
    document.addEventListener('DOMContentLoaded', () => {
      checkAdminAuthAndLoad();
    });

    function getAdminToken() {
      return localStorage.getItem('adminToken');
    }

    async function checkAdminAuthAndLoad() {
      const token = getAdminToken();
      if (!token) {
        // Chuyển sang trang đăng nhập nếu chưa có token
        window.location.href = '/login.html';
        return;
      }

      try {
        const res = await fetch(`${API_BASE_URL}/overview`, {
          headers: { 'Authorization': `Bearer ${token}` }
        });

        if (res.status === 401 || res.status === 403) {
          executeLogout();
          return;
        }

        const data = await res.json();
        renderOverview(data);
        loadOrdersList();
      } catch (error) {
        console.error('Lỗi khởi tạo hệ thống:', error);
      }
    }

    // 3. Quản lý Thống kê
    function renderOverview(data) {
      const revenueEl = document.getElementById('total-revenue');
      const usersEl = document.getElementById('total-users');
      const activeOrdersEl = document.getElementById('active-orders');

      if (revenueEl) revenueEl.textContent = `${(data.revenue || 0).toLocaleString()} VNĐ`;
      if (usersEl) usersEl.textContent = data.usersCount || 0;
      if (activeOrdersEl) activeOrdersEl.textContent = data.activeOrdersCount || 0;
    }

    // 4. Load & Render Danh Sách Đơn Hàng
    async function loadOrdersList() {
      const token = getAdminToken();
      try {
        const res = await fetch(`${API_BASE_URL}/orders`, {
          headers: { 'Authorization': `Bearer ${token}` }
        });
        const orders = await res.json();
        renderOrdersTable(orders);
      } catch (error) {
        console.error('Lỗi khi tải danh sách đơn hàng:', error);
      }
    }

    function renderOrdersTable(orders) {
      const tableBody = document.getElementById('orders-table-body');
      if (!tableBody) return;

      tableBody.innerHTML = '';
      if (!orders || orders.length === 0) {
        tableBody.innerHTML = '<tr><td colspan="5" style="text-align:center; color: var(--text-muted);">Không có đơn hàng nào.</td></tr>';
        return;
      }

      orders.forEach(order => {
        const isSpecialUser = PRIVILEGED_USERS.includes(order.username?.toLowerCase());
        
        const row = document.createElement('tr');
        row.innerHTML = `
          <td>${order.id}</td>
          <td>
            <strong>${order.username}</strong>
            ${isSpecialUser ? '<span class="badge badge-star">★ Đã ưu tiên</span>' : ''}
          </td>
          <td>${order.planName}</td>
          <td>${order.status === 'paid' ? '<span class="status-paid">Đã thanh toán</span>' : 'Chờ xử lý'}</td>
          <td>
            <button onclick="manualActivateOrder('${order.id}', '${order.username}')" class="btn-activate">
              Kích hoạt VIP
            </button>
            <button onclick="deleteOrder('${order.id}')" class="btn-delete">Xóa</button>
          </td>
        `;
        tableBody.appendChild(row);
      });
    }

    // 5. Kích hoạt VIP thủ công
    async function manualActivateOrder(orderId, username) {
      const token = getAdminToken();
      const isPrivileged = PRIVILEGED_USERS.includes(username?.toLowerCase());
      
      try {
        const res = await fetch(`${API_BASE_URL}/activate-vip`, {
          method: 'POST',
          headers: {
            'Content-Type': 'application/json',
            'Authorization': `Bearer ${token}`
          },
          body: JSON.stringify({ 
            orderId, 
            username,
            isVip: true,
            isPermanent: isPrivileged
          })
        });

        const result = await res.json();
        if (res.ok) {
          alert(`Đã kích hoạt thành công cho tài khoản ${username}!`);
          loadOrdersList();
        } else {
          alert(`Lỗi: ${result.error || 'Không thể kích hoạt đơn hàng'}`);
        }
      } catch (error) {
        console.error('Lỗi kích hoạt VIP:', error);
      }
    }

    // 6. Xóa Đơn Hàng
    async function deleteOrder(orderId) {
      if (!confirm('Bạn có chắc chắn muốn xóa đơn hàng này?')) return;
      const token = getAdminToken();

      try {
        const res = await fetch(`${API_BASE_URL}/orders/${orderId}`, {
          method: 'DELETE',
          headers: { 'Authorization': `Bearer ${token}` }
        });

        if (res.ok) {
          loadOrdersList();
        } else {
          alert('Không thể xóa đơn hàng');
        }
      } catch (error) {
        console.error('Lỗi khi xóa đơn hàng:', error);
      }
    }

    // 7. Lưu Cấu Hình Ngân Hàng
    async function saveBankConfig(event) {
      event.preventDefault();
      const token = getAdminToken();
      const formData = {
        bankName: document.getElementById('bank-name').value,
        accountNumber: document.getElementById('account-number').value,
        accountHolder: document.getElementById('account-holder').value
      };

      try {
        const res = await fetch(`${API_BASE_URL}/config/bank`, {
          method: 'POST',
          headers: {
            'Content-Type': 'application/json',
            'Authorization': `Bearer ${token}`
          },
          body: JSON.stringify(formData)
        });

        if (res.ok) {
          alert('Đã lưu cấu hình ngân hàng thành công!');
        }
      } catch (error) {
        console.error('Lỗi khi lưu ngân hàng:', error);
      }
    }

    // 8. Đăng Xuất
    function executeLogout() {
      localStorage.removeItem('adminToken');
      window.location.href = '/login.html';
    }
  </script>
</body>
</html>
