<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
  <title>Đăng Nhập Quản Trị — Locket VIP &amp; Gold System</title>
  <link rel="icon" type="image/svg+xml"
    href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E%E2%9A%99%EF%B8%8F%3C/text%3E%3C/svg%3E">

  <!-- Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link
    href="https://fonts.googleapis.com/css2?family=Nunito:wght@600;700;800;900&family=Space+Grotesk:wght@600;700;800&display=swap"
    rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">

  <style>
    :root {
      --bg-dark: #090B10;
      --bg-card: #141824;
      --gold: #F59E0B;
      --gold-light: #FDE68A;
      --vip: #8B5CF6;
      --emerald: #10B981;
      --rose: #EF4444;
      --border: rgba(255, 255, 255, 0.08);
      --text: #F8FAFC;
      --text-sub: #94A3B8;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: 'Nunito', sans-serif;
      background: var(--bg-dark);
      color: var(--text);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
      position: relative;
      overflow: hidden;
    }

    .glow-sphere {
      position: absolute;
      border-radius: 50%;
      filter: blur(120px);
      opacity: 0.15;
      pointer-events: none;
    }

    .glow-1 { width: 450px; height: 450px; background: radial-gradient(circle, #F59E0B, #EA580C); top: -100px; right: -100px; }
    .glow-2 { width: 450px; height: 450px; background: radial-gradient(circle, #8B5CF6, #6366F1); bottom: -100px; left: -100px; }

    .login-container {
      width: 100%;
      max-width: 430px;
      background: rgba(20, 24, 36, 0.85);
      border: 1px solid var(--border);
      border-radius: 28px;
      padding: 40px 32px;
      text-align: center;
      box-shadow: 0 25px 70px rgba(0, 0, 0, 0.7);
      backdrop-filter: blur(20px);
      position: relative;
      z-index: 10;
    }

    .brand-badge {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      padding: 6px 14px;
      background: rgba(245, 158, 11, 0.12);
      border: 1px solid rgba(245, 158, 11, 0.3);
      border-radius: 999px;
      font-size: 11px;
      font-weight: 800;
      color: var(--gold-light);
      letter-spacing: 1px;
      margin-bottom: 20px;
      text-transform: uppercase;
    }

    .login-logo { font-size: 52px; margin-bottom: 12px; line-height: 1; }

    h1 {
      font-size: 1.65rem;
      font-weight: 900;
      margin-bottom: 8px;
      background: linear-gradient(135deg, #FFFFFF 40%, var(--gold-light) 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    .subtitle { color: var(--text-sub); font-size: 0.92rem; margin-bottom: 28px; line-height: 1.5; }

    .form-group { position: relative; margin-bottom: 18px; text-align: left; }
    .input-wrapper { position: relative; display: flex; align-items: center; }

    .input-icon {
      position: absolute;
      left: 18px;
      color: var(--text-sub);
      font-size: 16px;
      pointer-events: none;
    }

    .login-input {
      width: 100%;
      height: 52px;
      border-radius: 14px;
      background: rgba(9, 11, 16, 0.65);
      border: 1.5px solid var(--border);
      color: #fff;
      padding: 0 46px 0 48px;
      font-size: 1.05rem;
      font-family: inherit;
      outline: none;
      transition: all 0.25s ease;
    }

    .login-input:focus {
      border-color: var(--gold);
      box-shadow: 0 0 0 4px rgba(245, 158, 11, 0.15);
    }

    .toggle-pass-btn {
      position: absolute;
      right: 14px;
      background: none;
      border: none;
      color: var(--text-sub);
      font-size: 16px;
      cursor: pointer;
      padding: 8px;
    }

    .btn-login {
      width: 100%;
      height: 52px;
      border-radius: 14px;
      background: linear-gradient(135deg, #F59E0B 0%, #D97706 100%);
      border: none;
      color: #000;
      font-size: 1.05rem;
      font-weight: 900;
      font-family: inherit;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      box-shadow: 0 10px 24px rgba(245, 158, 11, 0.35);
      transition: all 0.25s ease;
      margin-top: 10px;
    }

    .btn-login:hover { transform: translateY(-2px); filter: brightness(1.08); }

    .error-box {
      margin-top: 18px;
      padding: 12px 16px;
      border-radius: 12px;
      background: rgba(239, 68, 68, 0.12);
      border: 1px solid rgba(239, 68, 68, 0.3);
      color: #FCA5A5;
      font-size: 0.88rem;
      font-weight: 700;
      display: none;
      align-items: center;
      gap: 10px;
      text-align: left;
    }

    .security-badge {
      margin-top: 28px;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      font-size: 12px;
      color: var(--text-sub);
      font-weight: 700;
    }
    .security-badge i { color: var(--emerald); }

    .back-home {
      display: inline-block;
      margin-top: 20px;
      color: var(--text-sub);
      text-decoration: none;
      font-size: 12.5px;
      font-weight: 700;
    }
    .back-home:hover { color: var(--gold); }
  </style>
</head>

<body>
  <div class="glow-sphere glow-1"></div>
  <div class="glow-sphere glow-2"></div>

  <div class="login-container">
    <div class="brand-badge">
      <i class="fa-solid fa-shield-halved"></i> Trung Tâm Quản Trị Hệ Thống
    </div>

    <div class="login-logo">👑</div>
    <h1>TỔ CAM ADMIN</h1>
    <p class="subtitle">Nhập mật khẩu quản trị viên để mở khóa trung tâm điều khiển</p>

    <form id="admin-login-form" onsubmit="event.preventDefault(); handleLogin();">
      <div class="form-group">
        <div class="input-wrapper">
          <i class="fa-solid fa-key input-icon"></i>
          <input type="password" id="admin-password" class="login-input" placeholder="Nhập mật khẩu Admin..." autocomplete="current-password" autofocus required>
          <button type="button" class="toggle-pass-btn" onclick="togglePasswordVisibility()" title="Hiện/Ẩn mật khẩu">
            <i class="fa-solid fa-eye" id="eye-icon"></i>
          </button>
        </div>
      </div>

      <button type="submit" id="btn-submit" class="btn-login">
        <i class="fa-solid fa-lock-open"></i> Đăng Nhập An Toàn
      </button>

      <div id="login-error" class="error-box">
        <i class="fa-solid fa-circle-exclamation"></i>
        <span id="error-message"></span>
      </div>
    </form>

    <div class="security-badge">
      <i class="fa-solid fa-shield-check"></i> Xác thực bảo mật hai lớp • Mã hóa chống dò tìm
    </div>

    <a href="/" class="back-home"><i class="fa-solid fa-arrow-left"></i> Quay lại trang chủ Locket VIP</a>
  </div>

  <script>
    function togglePasswordVisibility() {
      const pass = document.getElementById('admin-password');
      const icon = document.getElementById('eye-icon');
      if (pass.type === 'password') {
        pass.type = 'text';
        icon.className = 'fa-solid fa-eye-slash';
      } else {
        pass.type = 'password';
        icon.className = 'fa-solid fa-eye';
      }
    }

    async function handleLogin() {
      const passInput = document.getElementById('admin-password');
      const btn = document.getElementById('btn-submit');
      const errBox = document.getElementById('login-error');
      const errMsg = document.getElementById('error-message');

      const password = passInput.value.trim();
      if (!password) {
        showError('Vui lòng nhập mật khẩu Admin!');
        return;
      }

      btn.disabled = true;
      btn.innerHTML = '<i class="fa-solid fa-circle-notch fa-spin"></i> Đang xác thực...';
      errBox.style.display = 'none';

      try {
        const res = await fetch('/api/admin/login', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ password })
        });

        const data = await res.json();

        if (res.ok && data.ok) {
          if (data.token) {
            // Lưu token vào localStorage để file admin.html nhận diện
            localStorage.setItem('adminToken', data.token);
            localStorage.setItem('locket_vip_admin_token', data.token);
          }
          btn.innerHTML = '<i class="fa-solid fa-circle-check"></i> Thành công! Đang chuyển hướng...';
          btn.style.background = 'linear-gradient(135deg, #10B981, #059669)';
          btn.style.color = '#fff';
          setTimeout(() => {
            window.location.href = '/admin';
          }, 400);
        } else {
          showError(data.message || 'Mật khẩu quản trị viên không chính xác!');
          btn.disabled = false;
          btn.innerHTML = '<i class="fa-solid fa-lock-open"></i> Đăng Nhập An Toàn';
          passInput.focus();
          passInput.select();
        }
      } catch (err) {
        showError('Lỗi kết nối máy chủ: ' + err.message);
        btn.disabled = false;
        btn.innerHTML = '<i class="fa-solid fa-lock-open"></i> Đăng Nhập An Toàn';
      }
    }

    function showError(msg) {
      const errBox = document.getElementById('login-error');
      const errMsg = document.getElementById('error-message');
      errMsg.innerText = msg;
      errBox.style.display = 'flex';
    }
  </script>
</body>
</html>
